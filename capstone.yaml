name: flyrank-capstone-meteringbilling
description: Usage-based metering and billing API

run: npm start
seed: npm run seed
test: npm test
base_url: http://localhost:3000

endpoints:
  - method: GET
    path: /
    description: API info
  - method: GET
    path: /health
    description: Health check
  - method: POST
    path: /generate
    description: Record billable usage event with idempotency and quota check
  - method: GET
    path: /usage
    description: Rollup usage events, limits, and cost breakdown
  - method: POST
    path: /api/usage
    description: Record usage event (compatibility alias)
  - method: GET
    path: /api/usage
    description: List usage events (compatibility alias)
  - method: POST
    path: /api/v1/checkout/session
    description: Create Stripe test Checkout session for Pro upgrade
  - method: POST
    path: /webhooks/stripe
    description: Signature-verified Stripe webhook handler with replay deduplication
  - method: POST
    path: /api/v1/jobs/reconcile
    description: Trigger background reconciliation and quota alert job
  - method: POST
    path: /api/customers
    description: Create customer
  - method: GET
    path: /api/customers
    description: List customers
  - method: GET
    path: /api/customers/:id
    description: Get customer by ID
  - method: POST
    path: /api/billing/calculate
    description: Calculate bill and pricing simulation
  - method: GET
    path: /api/billing/:customerId
    description: Get billing summary and itemized usage for customer
